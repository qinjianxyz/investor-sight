name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --silent

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --test-reporter=dot

      - name: Verify data
        run: npm run verify:data

      - name: Build
        run: npm run build
